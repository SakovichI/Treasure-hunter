<!doctype html>
<html lang="en">
  <head>
    <link rel="manifest" href="/Treasure-hunter/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Croissant+One&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/Treasure-hunter/assets/index-B7EZrgag.js"></script>
    <link rel="stylesheet" crossorigin href="/Treasure-hunter/assets/index.css">
  </head>
  <body>
    <div class="container-start-game">
      <div class="container__head header">
        <div class="header__timer"></div>
        <div class="header__counter">
          <div class="count">
            <span class="count__progress">0</span>
            <span class="count__need"></span>
          </div>
          <img
            src="/Treasure-hunter/assets/img/Chest_Ingots.png"
            alt="chest"
            class="count-img"
            width="50"
            height="50"
          />
        </div>
      </div>
    </div>
    <div class="game-over">
      <p class="game-over__text">Game Over</p>
      <p class="game-over__try">Tap to, try again</p>
    </div>
    <canvas id="render-canvas"></canvas>

  </body>
</html>
